[project]
name = "streampilot"
version = "0.1.0"
description = "Gymnasium drone tasks (waypoint, landing, tracking) in MuJoCo"
readme = "README.md"
authors = [
    { name = "Sebastian Nae", email = "naesebi2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "mujoco>=3.14.0",
    "torch>=2.14.0",
    "trackio>=0.38.1",
]

[project.scripts]
streampilot = "streampilot:main"
streampilot-train = "streampilot.train:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Streaming RL updates one sample at a time with small networks, so CPU torch is all we need.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
