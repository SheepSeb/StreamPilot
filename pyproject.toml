[project]
name = "streampilot"
version = "0.1.0"
description = "Gymnasium drone tasks (waypoint, landing, tracking) in MuJoCo"
readme = "README.md"
authors = [
    { name = "Sebastian Nae", email = "naesebi2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "mujoco>=3.14.0",
    "torch>=2.14.0",
    "trackio>=0.38.1",
]

[project.scripts]
streampilot = "streampilot:main"
streampilot-train = "streampilot.train:main"
streampilot-train-formation = "streampilot.train_formation:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
cpu = ["torch>=2.14.0"]
cuda = ["torch>=2.14.0"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

# Streaming RL updates one sample at a time with small networks, so CPU torch is the default
# (group `cpu`). For MAPPO updates on the GPU, swap in the CUDA build: --no-group cpu --group cuda
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
